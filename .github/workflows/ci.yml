name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: excoba_user
          POSTGRES_PASSWORD: excoba_pass
          POSTGRES_DB: excoba_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U excoba_user -d excoba_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgresql://excoba_user:excoba_pass@localhost:5432/excoba_test"
      SESSION_SECRET: "ci-secret-no-se-usa-en-produccion"
      APP_URL: "http://localhost:3000"
      NODE_ENV: "test"

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente de Prisma
        run: npm run prisma:generate

      - name: Verificación de tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Aplicar migraciones (base de datos de prueba)
        run: npm run prisma:migrate:deploy

      - name: Pruebas
        run: npm test

      - name: Build de producción
        run: npm run build
